[package]
name = "flyclash"
version = "0.2.9"
description = "FlyClash Desktop"
authors = ["FlyClash"]
license = "MIT"
repository = "https://github.com/GtxFury/FlyClash"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
urlencoding = "2"
zip = "2"
