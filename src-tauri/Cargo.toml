[package]
name = "flyclash"
version = "0.2.9"
description = "FlyClash Desktop"
authors = ["FlyClash"]
license = "MIT"
repository = "https://github.com/GtxFury/FlyClash"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

