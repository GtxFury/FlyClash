name: Tauri Build

on:
  push:
    branches:
      - tarui
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - tarui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            prepare_arch: x64
            bundles: nsis
            rust_target: ""
          - name: linux-x64
            runner: ubuntu-22.04
            prepare_arch: x64
            bundles: deb,appimage
            rust_target: ""
          - name: macos-x64
            runner: macos-15-intel
            prepare_arch: x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            prepare_arch: arm64
            bundles: dmg
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Go for Windows tools
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            native/helper/go.sum
            native/sysproxy/go.mod

      # Tauri packaging does not need Electron native rebuilds
      # (better-sqlite3 / ref-napi / ffi-napi). Skipping scripts avoids
      # node-gyp + Python distutils failures on modern macOS runners.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build Windows sysproxy
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd native\sysproxy
          call build-all.bat ${{ matrix.prepare_arch }}

      - name: Build Windows helper service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location native/helper
          go mod download
          $env:GOOS = "windows"
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o ../../tools/flyclash-helper.exe .
          Pop-Location

      - name: Prepare bundled runtime resources
        run: npm run prepare -- --${{ matrix.prepare_arch }}

      - name: Build Tauri bundle
        if: runner.os != 'macOS'
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Build Tauri bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          TARGET_ARGS=()
          BUNDLE_ROOT="src-tauri/target"
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET_ARGS=(--target "${{ matrix.rust_target }}")
            BUNDLE_ROOT="src-tauri/target/${{ matrix.rust_target }}"
          fi

          # Capture the real exit code. After a failed `if cmd; then ...; fi`,
          # `$?` is 0 (the if compound command succeeded), so we must store
          # status before the if/fi, not after.
          set +e
          npm run tauri:build -- --bundles "${{ matrix.bundles }}" "${TARGET_ARGS[@]}"
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Tauri build succeeded"
            ls -la "${BUNDLE_ROOT}/release/bundle" || true
            exit 0
          fi

          echo "::warning::Tauri DMG bundling failed with exit code ${status}; using the built .app as a release fallback."

          if [ -f "${BUNDLE_ROOT}/release/bundle/dmg/bundle_dmg.sh" ]; then
            echo "::group::bundle_dmg.sh"
            sed -n '1,240p' "${BUNDLE_ROOT}/release/bundle/dmg/bundle_dmg.sh"
            echo "::endgroup::"
          fi

          echo "::group::macOS bundle output"
          if [ -d "${BUNDLE_ROOT}/release/bundle" ]; then
            find "${BUNDLE_ROOT}/release/bundle" -maxdepth 4 -print | sort || true
          else
            echo "No bundle directory at ${BUNDLE_ROOT}/release/bundle"
            find "${BUNDLE_ROOT}/release" -maxdepth 3 -print 2>/dev/null | sort || true
          fi
          echo "::endgroup::"

          app_bundle=""
          if [ -d "${BUNDLE_ROOT}/release/bundle/macos" ]; then
            app_bundle="$(find "${BUNDLE_ROOT}/release/bundle/macos" -maxdepth 1 -name '*.app' -type d | head -n 1 || true)"
          fi
          if [ -z "$app_bundle" ]; then
            echo "::error::Tauri build failed (exit ${status}) and no .app bundle was produced under ${BUNDLE_ROOT}/release/bundle/macos."
            exit "$status"
          fi

          echo "Using fallback app bundle: $app_bundle"

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $arch = "${{ matrix.prepare_arch }}"
          $releaseDir = "src-tauri/target/release"
          $bundleDir = "$releaseDir/bundle/portable"
          $portableDir = "$releaseDir/portable/FlyClash_${version}_${arch}-portable"
          $archivePath = "$bundleDir/FlyClash_${version}_${arch}-portable.zip"

          Remove-Item -LiteralPath $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir, $bundleDir | Out-Null

          Copy-Item -LiteralPath "$releaseDir/flyclash.exe" -Destination "$portableDir/flyclash.exe" -Force
          Copy-Item -LiteralPath "$releaseDir/_up_" -Destination "$portableDir/_up_" -Recurse -Force

          Compress-Archive -Path "$portableDir/*" -DestinationPath $archivePath -Force
          Get-Item -LiteralPath $archivePath

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $platform = "${{ matrix.name }}"
          # Always collect into a workspace-relative path so upload-artifact can
          # use one location for host builds and cross-target macOS builds.
          $assetDir = "ci-release-assets"
          $rustTarget = "${{ matrix.rust_target }}"
          $bundleRoot = "src-tauri/target"
          if ($rustTarget -and $rustTarget.Trim() -ne "") {
            $bundleRoot = "src-tauri/target/$rustTarget"
          }
          $releaseDir = "$bundleRoot/release"

          Remove-Item -LiteralPath $assetDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          if ($env:RUNNER_OS -eq "Windows") {
            $installer = Get-ChildItem -LiteralPath "$releaseDir/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
            if (-not $installer) { throw "Missing Windows NSIS installer under $releaseDir/bundle/nsis" }
            Copy-Item -LiteralPath $installer.FullName -Destination "$assetDir/FlyClash_${version}_${platform}-installer.exe" -Force

            $portable = Get-ChildItem -LiteralPath "$releaseDir/bundle/portable" -Filter "*.zip" | Select-Object -First 1
            if (-not $portable) { throw "Missing Windows portable zip under $releaseDir/bundle/portable" }
            Copy-Item -LiteralPath $portable.FullName -Destination "$assetDir/FlyClash_${version}_${platform}-portable.zip" -Force
          } elseif ($env:RUNNER_OS -eq "Linux") {
            $deb = Get-ChildItem -LiteralPath "$releaseDir/bundle/deb" -Filter "*.deb" | Select-Object -First 1
            if (-not $deb) { throw "Missing Linux deb package under $releaseDir/bundle/deb" }
            Copy-Item -LiteralPath $deb.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.deb" -Force

            $appimage = Get-ChildItem -LiteralPath "$releaseDir/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if (-not $appimage) { throw "Missing Linux AppImage package under $releaseDir/bundle/appimage" }
            Copy-Item -LiteralPath $appimage.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.AppImage" -Force
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $dmg = Get-ChildItem -LiteralPath "$releaseDir/bundle/dmg" -Filter "*.dmg" -ErrorAction SilentlyContinue | Select-Object -First 1
            $dmgVerified = $false
            if ($dmg) {
              & /usr/bin/hdiutil verify $dmg.FullName
              $dmgVerified = $LASTEXITCODE -eq 0
            }

            if ($dmg -and $dmgVerified) {
              Copy-Item -LiteralPath $dmg.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.dmg" -Force
            } else {
              if ($dmg) {
                Write-Warning "Ignoring invalid macOS dmg: $($dmg.FullName)"
              }
              $app = Get-ChildItem -LiteralPath "$releaseDir/bundle/macos" -Filter "*.app" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $app) {
                throw "Missing macOS dmg package and app bundle under $releaseDir/bundle"
              }
              $zipPath = Join-Path (Resolve-Path $assetDir) "FlyClash_${version}_${platform}.app.zip"
              Push-Location -LiteralPath $app.Parent.FullName
              try {
                & /usr/bin/ditto -c -k --sequesterRsrc --keepParent $app.Name $zipPath
                if ($LASTEXITCODE -ne 0) { throw "ditto failed packaging $($app.Name)" }
              } finally {
                Pop-Location
              }
            }
          } else {
            throw "Unsupported runner OS: $env:RUNNER_OS"
          }

          $files = Get-ChildItem -LiteralPath $assetDir -File | Sort-Object Name
          if (-not $files -or $files.Count -eq 0) {
            throw "No release assets collected into $assetDir"
          }
          $files | Format-Table Name, Length, FullName

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyClash-${{ matrix.name }}
          path: ci-release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/tarui' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: FlyClash-*
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Resolve package version
        id: pkg
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare tarui rolling release tag
        if: github.ref == 'refs/heads/tarui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f tarui-latest "$GITHUB_SHA"
          git push origin refs/tags/tarui-latest --force

      - name: Publish tarui rolling release
        if: github.ref == 'refs/heads/tarui'
        uses: ncipollo/release-action@v1
        with:
          tag: tarui-latest
          commit: ${{ github.sha }}
          name: FlyClash Desktop v${{ steps.pkg.outputs.version }} 测试版 (tarui)
          body: |
            ## FlyClash Desktop v${{ steps.pkg.outputs.version }} 测试版

            tarui 开发通道滚动构建。

            ### 相对 main 的主要变化
            - 桌面框架由 Electron 迁移至 Tauri
            - 安装包体积显著减小
            - 支持 Windows / macOS / Linux 多平台产物
            - 测试版，功能可能不稳定，欢迎反馈
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build versioned release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # 优先取 CHANGELOG.md 中当前版本的章节作为发布说明
          if [ -f CHANGELOG.md ] && grep -q "^## ${TAG}" CHANGELOG.md; then
            {
              echo "## FlyClash Desktop ${TAG} 测试版"
              echo
              awk -v tag="^## ${TAG}" '
                $0 ~ tag { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md
              echo
              echo "> 当前为测试版，可能存在兼容性问题，欢迎到 Issues / 交流群反馈。"
              echo
            } > release-notes.md
          else
            {
              echo "## FlyClash Desktop v${VERSION} 测试版"
              echo
              echo "相对 main（Electron）切到 tarui（Tauri）的主要变化："
              echo
              echo "- 桌面框架由 **Electron 迁移至 Tauri**"
              echo "- **安装包体积显著减小**（示例：Windows 安装包约 145MB → 33MB，macOS DMG 约 170MB → 46MB）"
              echo "- 提供 Windows / macOS / Linux 多平台安装包"
              echo "- 保留订阅管理、代理组、系统代理、TUN、连接统计等核心能力"
              echo "- macOS TUN 授权与界面适配；Windows 原生系统代理 / Helper 服务"
              echo
              echo "> 当前为测试版，可能存在兼容性问题，欢迎到 Issues / 交流群反馈。"
              echo
            } > release-notes.md
          fi

          {
            echo "name=FlyClash Desktop v${VERSION} 测试版"
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "----- release notes -----"
          cat release-notes.md

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: false
          prerelease: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
