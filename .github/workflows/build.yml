name: Tauri Build

on:
  push:
    branches:
      - tarui
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - tarui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            prepare_arch: x64
            bundles: nsis
            rust_target: ""
          - name: linux-x64
            runner: ubuntu-22.04
            prepare_arch: x64
            bundles: deb,appimage
            rust_target: ""
          - name: macos-x64
            runner: macos-15-intel
            prepare_arch: x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            prepare_arch: arm64
            bundles: dmg
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Go for Windows tools
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            native/helper/go.sum
            native/sysproxy/go.mod

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows sysproxy
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd native\sysproxy
          call build-all.bat ${{ matrix.prepare_arch }}

      - name: Build Windows helper service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location native/helper
          go mod download
          $env:GOOS = "windows"
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o ../../tools/flyclash-helper.exe .
          Pop-Location

      - name: Prepare bundled runtime resources
        run: npm run prepare -- --${{ matrix.prepare_arch }}

      - name: Build Tauri bundle
        if: runner.os != 'macOS'
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Build Tauri bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          TARGET_ARGS=()
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET_ARGS=(--target "${{ matrix.rust_target }}")
          fi

          if npm run tauri -- build --bundles "${{ matrix.bundles }}" "${TARGET_ARGS[@]}"; then
            exit 0
          fi

          status=$?
          echo "::warning::Tauri DMG bundling failed with exit code ${status}; using the built .app as a release fallback."

          BUNDLE_ROOT="src-tauri/target"
          if [ -n "${{ matrix.rust_target }}" ]; then
            BUNDLE_ROOT="src-tauri/target/${{ matrix.rust_target }}"
          fi

          if [ -f "${BUNDLE_ROOT}/release/bundle/dmg/bundle_dmg.sh" ]; then
            echo "::group::bundle_dmg.sh"
            sed -n '1,240p' "${BUNDLE_ROOT}/release/bundle/dmg/bundle_dmg.sh"
            echo "::endgroup::"
          fi

          echo "::group::macOS bundle output"
          find "${BUNDLE_ROOT}/release/bundle" -maxdepth 4 -print | sort || true
          echo "::endgroup::"

          app_bundle="$(find "${BUNDLE_ROOT}/release/bundle/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::Tauri DMG failed and no .app bundle was produced."
            exit "$status"
          fi

          echo "Using fallback app bundle: $app_bundle"

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $arch = "${{ matrix.prepare_arch }}"
          $releaseDir = "src-tauri/target/release"
          $bundleDir = "$releaseDir/bundle/portable"
          $portableDir = "$releaseDir/portable/FlyClash_${version}_${arch}-portable"
          $archivePath = "$bundleDir/FlyClash_${version}_${arch}-portable.zip"

          Remove-Item -LiteralPath $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir, $bundleDir | Out-Null

          Copy-Item -LiteralPath "$releaseDir/flyclash.exe" -Destination "$portableDir/flyclash.exe" -Force
          Copy-Item -LiteralPath "$releaseDir/_up_" -Destination "$portableDir/_up_" -Recurse -Force

          Compress-Archive -Path "$portableDir/*" -DestinationPath $archivePath -Force
          Get-Item -LiteralPath $archivePath

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $platform = "${{ matrix.name }}"
          $releaseDir = "src-tauri/target/release"
          $assetDir = "$releaseDir/release-assets"

          Remove-Item -LiteralPath $assetDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          if ($env:RUNNER_OS -eq "Windows") {
            $installer = Get-ChildItem -LiteralPath "$releaseDir/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
            if (-not $installer) { throw "Missing Windows NSIS installer" }
            Copy-Item -LiteralPath $installer.FullName -Destination "$assetDir/FlyClash_${version}_${platform}-installer.exe" -Force

            $portable = Get-ChildItem -LiteralPath "$releaseDir/bundle/portable" -Filter "*.zip" | Select-Object -First 1
            if (-not $portable) { throw "Missing Windows portable zip" }
            Copy-Item -LiteralPath $portable.FullName -Destination "$assetDir/FlyClash_${version}_${platform}-portable.zip" -Force
          } elseif ($env:RUNNER_OS -eq "Linux") {
            $deb = Get-ChildItem -LiteralPath "$releaseDir/bundle/deb" -Filter "*.deb" | Select-Object -First 1
            if (-not $deb) { throw "Missing Linux deb package" }
            Copy-Item -LiteralPath $deb.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.deb" -Force

            $appimage = Get-ChildItem -LiteralPath "$releaseDir/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if (-not $appimage) { throw "Missing Linux AppImage package" }
            Copy-Item -LiteralPath $appimage.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.AppImage" -Force
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $bundleRoot = "src-tauri/target"
            if ("${{ matrix.rust_target }}" -ne "") {
              $bundleRoot = "src-tauri/target/${{ matrix.rust_target }}"
            }
            $releaseDir = "$bundleRoot/release"
            $dmg = Get-ChildItem -LiteralPath "$releaseDir/bundle/dmg" -Filter "*.dmg" -ErrorAction SilentlyContinue | Select-Object -First 1
            $dmgVerified = $false
            if ($dmg) {
              & /usr/bin/hdiutil verify $dmg.FullName
              $dmgVerified = $LASTEXITCODE -eq 0
            }

            if ($dmg -and $dmgVerified) {
              Copy-Item -LiteralPath $dmg.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.dmg" -Force
            } else {
              if ($dmg) {
                Write-Warning "Ignoring invalid macOS dmg: $($dmg.FullName)"
              }
              $app = Get-ChildItem -LiteralPath "$releaseDir/bundle/macos" -Filter "*.app" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $app) { throw "Missing macOS dmg package and app bundle" }
              $zipPath = "$assetDir/FlyClash_${version}_${platform}.app.zip"
              Push-Location -LiteralPath $app.Parent.FullName
              try {
                & /usr/bin/ditto -c -k --sequesterRsrc --keepParent $app.Name $zipPath
              } finally {
                Pop-Location
              }
            }
          } else {
            throw "Unsupported runner OS: $env:RUNNER_OS"
          }

          Get-ChildItem -LiteralPath $assetDir | Sort-Object Name

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyClash-${{ matrix.name }}
          path: src-tauri/target/release/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/tarui' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: FlyClash-*
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Prepare tarui rolling release tag
        if: github.ref == 'refs/heads/tarui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f tarui-latest "$GITHUB_SHA"
          git push origin refs/tags/tarui-latest --force

      - name: Publish tarui rolling release
        if: github.ref == 'refs/heads/tarui'
        uses: ncipollo/release-action@v1
        with:
          tag: tarui-latest
          commit: ${{ github.sha }}
          name: FlyClash tarui latest
          body: |
            Automated tarui build for `${{ github.sha }}`.

            Windows assets:
            - `FlyClash_*_windows-x64-installer.exe`: installer
            - `FlyClash_*_windows-x64-portable.zip`: portable package
            macOS assets:
            - `FlyClash_*_macos-x64.dmg`: disk image when DMG bundling succeeds
            - `FlyClash_*_macos-x64.app.zip`: zipped app fallback when DMG bundling is unavailable on the runner
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
