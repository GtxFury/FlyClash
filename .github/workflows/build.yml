name: Tauri Build

on:
  push:
    branches:
      - tarui
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - tarui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            prepare_arch: x64
            bundles: nsis
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - name: linux-x64
            runner: ubuntu-22.04
            prepare_arch: x64
            bundles: deb,appimage
            artifact_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos-x64
            runner: macos-15-intel
            prepare_arch: x64
            bundles: dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Go for Windows tools
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            native/helper/go.sum
            native/sysproxy/go.mod

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows sysproxy
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd native\sysproxy
          call build-all.bat ${{ matrix.prepare_arch }}

      - name: Build Windows helper service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location native/helper
          go mod download
          $env:GOOS = "windows"
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o ../../tools/flyclash-helper.exe .
          Pop-Location

      - name: Prepare bundled runtime resources
        run: npm run prepare -- --${{ matrix.prepare_arch }}

      - name: Build Tauri bundle
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyClash-${{ matrix.name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_paths }}
          fail_on_unmatched_files: false
          token: ${{ secrets.GITHUB_TOKEN }}
