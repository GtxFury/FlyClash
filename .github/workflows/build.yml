name: Tauri Build

on:
  push:
    branches:
      - tarui
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - tarui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            prepare_arch: x64
            bundles: nsis
            rust_target: ""
          - name: linux-x64
            runner: ubuntu-22.04
            prepare_arch: x64
            bundles: deb,appimage
            rust_target: ""
          - name: macos-x64
            runner: macos-15-intel
            prepare_arch: x64
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - name: macos-arm64
            runner: macos-15
            prepare_arch: arm64
            bundles: dmg
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.name }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Go for Windows tools
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            native/helper/go.sum
            native/sysproxy/go.mod

      # Tauri packaging does not need Electron native rebuilds
      # (better-sqlite3 / ref-napi / ffi-napi). Skipping scripts avoids
      # node-gyp + Python distutils failures on modern macOS runners.
      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build Windows sysproxy
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd native\sysproxy
          call build-all.bat ${{ matrix.prepare_arch }}

      - name: Build Windows helper service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location native/helper
          go mod download
          $env:GOOS = "windows"
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o ../../tools/flyclash-helper.exe .
          Pop-Location

      - name: Prepare bundled runtime resources
        run: npm run prepare -- --${{ matrix.prepare_arch }}

      - name: Build Tauri bundle
        if: runner.os != 'macOS'
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      - name: Build Tauri bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          TARGET_ARGS=()
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET_ARGS=(--target "${{ matrix.rust_target }}")
          fi

          if npm run tauri:build -- --bundles "${{ matrix.bundles }}" "${TARGET_ARGS[@]}"; then
            exit 0
          fi

          status=$?
          echo "::warning::Tauri DMG bundling failed with exit code ${status}; using the built .app as a release fallback."

          BUNDLE_ROOT="src-tauri/target"
          if [ -n "${{ matrix.rust_target }}" ]; then
            BUNDLE_ROOT="src-tauri/target/${{ matrix.rust_target }}"
          fi

          if [ -f "${BUNDLE_ROOT}/release/bundle/dmg/bundle_dmg.sh" ]; then
            echo "::group::bundle_dmg.sh"
            sed -n '1,240p' "${BUNDLE_ROOT}/release/bundle/dmg/bundle_dmg.sh"
            echo "::endgroup::"
          fi

          echo "::group::macOS bundle output"
          find "${BUNDLE_ROOT}/release/bundle" -maxdepth 4 -print | sort || true
          echo "::endgroup::"

          app_bundle="$(find "${BUNDLE_ROOT}/release/bundle/macos" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$app_bundle" ]; then
            echo "::error::Tauri DMG failed and no .app bundle was produced."
            exit "$status"
          fi

          echo "Using fallback app bundle: $app_bundle"

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $arch = "${{ matrix.prepare_arch }}"
          $releaseDir = "src-tauri/target/release"
          $bundleDir = "$releaseDir/bundle/portable"
          $portableDir = "$releaseDir/portable/FlyClash_${version}_${arch}-portable"
          $archivePath = "$bundleDir/FlyClash_${version}_${arch}-portable.zip"

          Remove-Item -LiteralPath $portableDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $portableDir, $bundleDir | Out-Null

          Copy-Item -LiteralPath "$releaseDir/flyclash.exe" -Destination "$portableDir/flyclash.exe" -Force
          Copy-Item -LiteralPath "$releaseDir/_up_" -Destination "$portableDir/_up_" -Recurse -Force

          Compress-Archive -Path "$portableDir/*" -DestinationPath $archivePath -Force
          Get-Item -LiteralPath $archivePath

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $platform = "${{ matrix.name }}"
          $releaseDir = "src-tauri/target/release"
          $assetDir = "$releaseDir/release-assets"

          Remove-Item -LiteralPath $assetDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          if ($env:RUNNER_OS -eq "Windows") {
            $installer = Get-ChildItem -LiteralPath "$releaseDir/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
            if (-not $installer) { throw "Missing Windows NSIS installer" }
            Copy-Item -LiteralPath $installer.FullName -Destination "$assetDir/FlyClash_${version}_${platform}-installer.exe" -Force

            $portable = Get-ChildItem -LiteralPath "$releaseDir/bundle/portable" -Filter "*.zip" | Select-Object -First 1
            if (-not $portable) { throw "Missing Windows portable zip" }
            Copy-Item -LiteralPath $portable.FullName -Destination "$assetDir/FlyClash_${version}_${platform}-portable.zip" -Force
          } elseif ($env:RUNNER_OS -eq "Linux") {
            $deb = Get-ChildItem -LiteralPath "$releaseDir/bundle/deb" -Filter "*.deb" | Select-Object -First 1
            if (-not $deb) { throw "Missing Linux deb package" }
            Copy-Item -LiteralPath $deb.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.deb" -Force

            $appimage = Get-ChildItem -LiteralPath "$releaseDir/bundle/appimage" -Filter "*.AppImage" | Select-Object -First 1
            if (-not $appimage) { throw "Missing Linux AppImage package" }
            Copy-Item -LiteralPath $appimage.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.AppImage" -Force
          } elseif ($env:RUNNER_OS -eq "macOS") {
            $bundleRoot = "src-tauri/target"
            if ("${{ matrix.rust_target }}" -ne "") {
              $bundleRoot = "src-tauri/target/${{ matrix.rust_target }}"
            }
            $releaseDir = "$bundleRoot/release"
            $dmg = Get-ChildItem -LiteralPath "$releaseDir/bundle/dmg" -Filter "*.dmg" -ErrorAction SilentlyContinue | Select-Object -First 1
            $dmgVerified = $false
            if ($dmg) {
              & /usr/bin/hdiutil verify $dmg.FullName
              $dmgVerified = $LASTEXITCODE -eq 0
            }

            if ($dmg -and $dmgVerified) {
              Copy-Item -LiteralPath $dmg.FullName -Destination "$assetDir/FlyClash_${version}_${platform}.dmg" -Force
            } else {
              if ($dmg) {
                Write-Warning "Ignoring invalid macOS dmg: $($dmg.FullName)"
              }
              $app = Get-ChildItem -LiteralPath "$releaseDir/bundle/macos" -Filter "*.app" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if (-not $app) { throw "Missing macOS dmg package and app bundle" }
              $zipPath = "$assetDir/FlyClash_${version}_${platform}.app.zip"
              Push-Location -LiteralPath $app.Parent.FullName
              try {
                & /usr/bin/ditto -c -k --sequesterRsrc --keepParent $app.Name $zipPath
              } finally {
                Pop-Location
              }
            }
          } else {
            throw "Unsupported runner OS: $env:RUNNER_OS"
          }

          Get-ChildItem -LiteralPath $assetDir | Sort-Object Name

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlyClash-${{ matrix.name }}
          path: src-tauri/target/release/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/tarui' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: FlyClash-*
          merge-multiple: true

      - name: List release assets
        run: |
          find release-assets -maxdepth 1 -type f -print | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Resolve package version
        id: pkg
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare tarui rolling release tag
        if: github.ref == 'refs/heads/tarui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f tarui-latest "$GITHUB_SHA"
          git push origin refs/tags/tarui-latest --force

      - name: Publish tarui rolling release
        if: github.ref == 'refs/heads/tarui'
        uses: ncipollo/release-action@v1
        with:
          tag: tarui-latest
          commit: ${{ github.sha }}
          name: FlyClash ${{ steps.pkg.outputs.version }} · tarui latest
          body: |
            ## FlyClash ${{ steps.pkg.outputs.version }} (tarui 滚动构建)

            自动构建自分支 `tarui`，提交 `${{ github.sha }}`。

            > 这是开发通道预发布包，正式版本请使用 `v*` 标签发布（例如 `v${{ steps.pkg.outputs.version }}`）。

            ### 下载说明
            - Windows: `FlyClash_${{ steps.pkg.outputs.version }}_windows-x64-installer.exe` / portable zip
            - macOS: `FlyClash_${{ steps.pkg.outputs.version }}_macos-arm64.dmg` / `macos-x64.dmg`（失败时可能为 `.app.zip`）
            - Linux: `FlyClash_${{ steps.pkg.outputs.version }}_linux-x64.deb` / AppImage
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          prerelease: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build versioned release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PKG_VERSION="${{ steps.pkg.outputs.version }}"
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^" 2>/dev/null || true)"

          {
            echo "## FlyClash Desktop ${TAG}"
            echo
            echo "正式版本发布 · Package \`${PKG_VERSION}\` · Commit \`${GITHUB_SHA:0:7}\`"
            echo
            echo "### 更新日志"
            if [ -n "${PREV}" ] && [ "${PREV}" != "${TAG}" ]; then
              echo
              echo "_自 ${PREV} 以来的提交：_"
              echo
              git log --pretty=format:'- %s' "${PREV}..${GITHUB_SHA}"
              echo
            else
              echo
              echo "- 详见下方自动生成的 GitHub Release Notes"
              echo
            fi
            echo
            echo "### 下载说明"
            echo
            echo "| 平台 | 文件 |"
            echo "| --- | --- |"
            echo "| Windows x64 安装包 | \`FlyClash_${VERSION}_windows-x64-installer.exe\` |"
            echo "| Windows x64 便携版 | \`FlyClash_${VERSION}_windows-x64-portable.zip\` |"
            echo "| macOS Apple Silicon | \`FlyClash_${VERSION}_macos-arm64.dmg\` |"
            echo "| macOS Intel | \`FlyClash_${VERSION}_macos-x64.dmg\` |"
            echo "| Linux x64 DEB | \`FlyClash_${VERSION}_linux-x64.deb\` |"
            echo "| Linux x64 AppImage | \`FlyClash_${VERSION}_linux-x64.AppImage\` |"
            echo
            echo "### 说明"
            echo
            echo "- macOS 若 DMG 打包失败，可能提供 \`.app.zip\` 作为回退产物"
            echo "- 首次启用 TUN 需要系统授权（Windows Helper 服务 / macOS 内核 setuid）"
            echo
          } > release-notes.md

          {
            echo "name=FlyClash Desktop ${TAG}"
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "----- release notes -----"
          cat release-notes.md

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          artifacts: release-assets/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
